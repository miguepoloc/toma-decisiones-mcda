<style>

  --bg:#ECF0EF;--surface:#FFFFFF;--surface2:#F4F7F6;--ink:#12211F;--muted:#586967;--line:#D2DBD9;

  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;

  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1516;--surface:#131F21;--surface2:#182729;--ink:#E3EEEC;--muted:#94A9A6;--line:#263A3C;
  --pa:#98A6FF;--pa-soft:#1D2350;--pa-ink:#0B1030;
  --pb:#4CC9D2;--pb-soft:#123A3F;--pb-ink:#05191B;
  --pass:#5FCB8A;--pass-soft:#143624;--warn:#F0A060;--warn-soft:#3B2614;--other:#6D807E;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;}}
:root[data-theme="dark"]{
  --bg:#0C1516;--surface:#131F21;--surface2:#182729;--ink:#E3EEEC;--muted:#94A9A6;--line:#263A3C;
  --pa:#98A6FF;--pa-soft:#1D2350;--pa-ink:#0B1030;
  --pb:#4CC9D2;--pb-soft:#123A3F;--pb-ink:#05191B;
  --pass:#5FCB8A;--pass-soft:#143624;--warn:#F0A060;--warn-soft:#3B2614;--other:#6D807E;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);padding-inline:16px}
.wrap{max-width:1100px;margin:0 auto;padding-block:26px 64px;--accent:var(--pb);--accent-soft:var(--pb-soft);--accent-ink:var(--pb-ink)}

h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(26px,4.6vw,38px);font-weight:700;letter-spacing:-.01em}
h2{font-size:24px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.head{display:grid;gap:14px;margin-bottom:20px}
.obj{font-size:14px;color:var(--muted);max-width:80ch}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.part{appearance:none;font:inherit;text-align:left;cursor:pointer;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-top-width:5px;border-radius:6px;padding:10px 14px;display:grid;gap:2px}
.part.pa{border-top-color:var(--pa)}.part.pb{border-top-color:var(--pb)}

.prog{display:grid;gap:5px;max-width:520px}

.banner b{color:var(--warn)}
.banner.info{background:var(--accent-soft);border-color:var(--accent)}

.store{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:13px}

.ni .t{font-weight:600;color:var(--ink);font-size:14px}
.ni .s{font:500 11px var(--f-mono);letter-spacing:.03em}
.ni[aria-current="page"]{border-color:var(--accent);background:var(--surface)}

.s.ok{color:var(--pass)}.s.bad{color:var(--warn)}

  .ni{border-left:0;border-bottom:3px solid var(--line);flex:0 0 auto;max-width:190px}.ni[aria-current="page"]{border-color:var(--accent);background:transparent}.ni.sep{margin:0}}

.panel{display:grid;gap:18px;min-width:0}

textarea{resize:vertical;min-height:64px}
label.lbl{font:500 12px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.btn{appearance:none;font:600 14px var(--f-body);border-radius:4px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}

.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:10px}

.form{display:grid;gap:14px}
.fgrp{display:grid;gap:8px}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}

.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* selector */

.tabs button span{font:400 11px var(--f-mono)}

/* parte A */
.ideas{display:grid;gap:8px}
.idea{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1.5fr) auto;gap:8px;align-items:center}

@media(max-width:640px){.idea{grid-template-columns:22px minmax(0,1fr) auto}.idea input:nth-child(3){grid-column:2/3}}
.cand{display:grid;gap:10px}
.cand-top{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.cand-name{font-weight:600}
.cand.out{background:var(--surface2)}
.cand.out .cand-name{color:var(--muted);text-decoration:line-through}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--line);vertical-align:bottom}

td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td input[type=text]{padding:5px 8px;font-size:13px}
tr.win td{font-weight:600}
.legend{display:grid;gap:6px;font-size:14px}
.legend div{display:grid;grid-template-columns:34px 1fr;gap:8px}
.legend b{font-family:var(--f-mono);font-weight:500;color:var(--accent)}
.pond{font:500 15px var(--f-mono)}
.pond.no{color:var(--muted);font-weight:400}
.kpis{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;font-size:14px}
.kpis .flow{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kpis .flow b{font:500 22px var(--f-mono)}
.arrow{color:var(--muted)}
.pill{font:500 12px var(--f-mono);padding:3px 10px;border-radius:99px;background:var(--pass-soft);color:var(--pass);border:1px solid var(--pass);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.pill.neutral{background:var(--surface2);color:var(--muted);border-color:var(--line)}
.cut{display:grid;gap:8px}
.cut-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.cut-val{font:500 30px var(--f-mono);color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);height:28px;margin:0}
.cbar{display:grid;grid-template-columns:minmax(110px,230px) 1fr;gap:12px;align-items:center;padding-block:5px}
.cbar .nm{font-size:13px;line-height:1.3}
.cbar.out .nm{color:var(--muted)}
.track{position:relative;height:24px;background:var(--surface2);border-radius:2px}
.fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:2px}

.val{position:absolute;top:50%;transform:translateY(-50%);font:500 12px var(--f-mono);padding-left:6px;color:var(--ink)}
.val.in{color:var(--accent-ink);padding:0 6px 0 0;transform:translate(-100%,-50%)}
.tick{position:absolute;top:-5px;bottom:-5px;width:0;border-left:2px dashed var(--warn)}
.axis{display:grid;grid-template-columns:minmax(110px,230px) 1fr;gap:12px;font:400 11px var(--f-mono);color:var(--muted)}

@media(max-width:520px){.cbar,.axis{grid-template-columns:96px 1fr;gap:8px}}
.finals{display:grid;gap:12px}
.final{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:start}
.final .rk{font:500 20px var(--f-mono);color:var(--accent);grid-row:span 2}
.final .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.tag{font:500 11px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--warn);border:1px solid var(--warn);padding:1px 7px;border-radius:99px}

/* parte B */
.hint{background:var(--accent-soft);border-radius:4px;padding:8px 12px;font-size:14px}
.role{font-size:13px;color:var(--muted)}
.pairs{display:grid;gap:10px}
.pair{display:grid;gap:6px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.pair .names{display:flex;justify-content:space-between;gap:12px;font-weight:600;font-size:14px;line-height:1.3}
.pair .names span:last-child{text-align:right}
.pair input[type=range]{margin:2px 0 0;height:26px}
.pair.un input[type=range]{accent-color:var(--muted)}
.ticks{display:flex;justify-content:space-between;font:400 11px var(--f-mono);color:var(--muted);padding-inline:7px}
.read{font-size:13px;color:var(--muted);min-height:20px}
.pair:not(.un) .read{color:var(--ink)}
.read b{font-family:var(--f-mono);font-weight:500}
.res{display:grid;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.metrics{display:flex;flex-wrap:wrap;gap:6px 26px}
.metrics div{display:grid}
.metrics b{font:500 20px var(--f-mono)}
.metrics small{font:500 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.wbar{display:grid;grid-template-columns:minmax(110px,220px) 1fr;gap:12px;align-items:center;padding-block:4px}
.wbar .nm{font-size:13px;line-height:1.3}
@media(max-width:520px){.wbar{grid-template-columns:96px 1fr;gap:8px}}
details summary{cursor:pointer;font-weight:600}
h4{font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 0}
.win{display:grid;gap:4px;border-left:4px solid var(--accent)}
.win .big{font:700 26px var(--f-display)}
.stack{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:minmax(110px,200px) 1fr;gap:12px;align-items:center}
.srow .nm{font-size:13px;line-height:1.3}
.strack{display:flex;align-items:center;gap:8px}
.sbar{display:flex;height:26px}
.sbar i{display:block;height:100%;border-left:2px solid var(--surface);cursor:default}
.sbar i:first-child{border-left:0;border-radius:3px 0 0 3px}
.sbar i:last-child{border-radius:0 3px 3px 0}
.sval{font:500 13px var(--f-mono);white-space:nowrap}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.lg span{display:flex;gap:6px;align-items:center}
.lg i{width:12px;height:12px;border-radius:2px;display:block}
@media(max-width:520px){.srow{grid-template-columns:1fr;gap:3px}}
#tip{position:fixed;z-index:20;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:4px;pointer-events:none;max-width:260px;display:none}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:4px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}

<div class="wrap" id="wrap" data-part="A">
  <div class="head">
    <h1>Decisión multicriterio para la estrategia ASR</h1>
    <p class="obj" id="objline"></p>
    <div class="parts" id="parts"></div>
    <div class="prog" id="prog"></div>
    <div class="store" id="store" hidden></div><input type="file" id="fin" accept=".xlsx,.json,application/json" hidden>
    <div class="banner" id="demoBanner" hidden><span><b>Juicios de ejemplo cargados en el AHP.</b> Sirven solo para comprobar que el mecanismo calcula; no son de tu panel. Bórralos antes de usar los resultados.</span><button class="btn" data-act="clear" type="button">Borrar todos los juicios</button></div>
  </div>
  <div class="layout"><nav class="side" id="nav" aria-label="Hojas"></nav><main id="main"></main></div>
</div>
<div id="tip"></div><div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
const SEED=/*SEED*/null;
const KEY='mcda-asr-v2',OLD='ahp-asr-v1';
const RI=[0,0,0,.58,.9,1.12,1.24,1.32,1.41,1.45,1.49];
const SAATY={2:'levemente',3:'moderadamente',4:'entre moderada y fuertemente',5:'fuertemente',6:'entre fuerte y muy fuertemente',7:'muy fuertemente',8:'entre muy fuerte y extremadamente',9:'extremadamente'};
const ASTEPS=[['A1','Lluvia de ideas'],['A2','Tamizaje'],['A3','Independencia'],['A4','Panel de importancia'],['A5','Resultado final']];
const SRC={k0:'c1',k1:'c2',k2:'c6',k3:'c8',k4:'c7'};

/* ---------- estado ---------- */
function fresh(){
  const evs=[1,2,3,4].map(i=>({id:'v'+i,name:'Evaluador '+i}));
  const cands=SEED.cands.map(c=>{
    const se={};(c.se||[]).forEach((x,i)=>{se[evs[i].id]=x});
    return {id:c.id,name:c.name,desc:c.desc||'',stage:c.stage,at:c.at||'',target:c.target||null,reason:c.reason||'',evid:c.evid||'',
      qmide:c.qmide||'',ind:c.ind||'',sq:c.sq||[null,null,null,null,null],se,just:c.just||'',cutReason:c.cutReason||''}});
  return {v:2,nid:100,view:'A1',exId:'e0',demo:false,obj:SEED.objective.replace(/\s+/g,' ').trim(),
    A:{cands,evaluators:evs,questions:SEED.questions,mode:'ev',cutoff:4.0},
    crit:[
      {id:'k0',src:'c1',name:'Eficiencia de datos',hint:'Prefiere la estrategia que necesita MENOS horas de audio transcrito para un desempeño aceptable.'},
      {id:'k1',src:'c2',name:'Métricas WER/CER',hint:'Prefiere la que alcanza el MENOR error (WER/CER) según lo reportado para lenguas de pocos recursos.'},
      {id:'k2',src:'c6',name:'Madurez y soporte de herramientas',hint:'Prefiere la que tiene implementaciones más estables y documentadas (Whisper, wav2vec 2.0, MMS).'},
      {id:'k3',src:'c8',name:'Dependencia de anotación',hint:'Prefiere la que exige MENOS transcripción por parte de los hablantes nativos.'},
      {id:'k4',src:'c7',name:'Transferibilidad entre lenguas',hint:'Prefiere la que mejor se traslada a otra lengua de la Sierra Nevada sin reentrenar desde cero.'}],
    alt:['Fine-tuning supervisado','Transfer learning cross-lingual','Aprendizaje autosupervisado','Data augmentation'].map((n,i)=>({id:'a'+i,name:n})),
    experts:['Ingeniero/investigador en Machine Learning o voz (ASR)','Ingeniero electrónico, procesamiento de señales','Hablante nativo colaborador'].map((n,i)=>({id:'e'+i,name:n})),
    J:{crit:{},alt:{}}};
}
function migrate(o){
  const S=fresh();
  S.obj=o.obj||S.obj;S.demo=!!o.demo;
  S.crit=o.crit.map((c,i)=>({id:'k'+i,src:(S.crit[i]||{}).src,name:c.name,hint:c.hint||''}));
  S.alt=o.alt.map((n,i)=>({id:'a'+i,name:n}));
  S.experts=o.experts.map((n,i)=>({id:'e'+i,name:n}));
  const conv=(m,p)=>{const r={};Object.keys(m||{}).forEach(k=>{const [i,j]=k.split('-');r[p+i+'-'+p+j]=m[k]});return r};
  S.experts.forEach((e,ei)=>{S.J.crit[e.id]=conv((o.J.crit||[])[ei],'k')});
  S.crit.forEach((c,ci)=>{S.J.alt[c.id]={};S.experts.forEach((e,ei)=>{S.J.alt[c.id][e.id]=conv((((o.J.alt||[])[ci])||[])[ei],'a')})});
  const v=o.view;S.view=v==='cfg'?'bcfg':v==='crit'?'crit':v==='syn'?'syn':(/^alt\d+$/.test(v||'')?'alt:k'+v.slice(3):'A1');
  return S;
}
function valid(s){return s&&s.v===2&&s.A&&Array.isArray(s.A.cands)&&Array.isArray(s.crit)&&Array.isArray(s.alt)&&Array.isArray(s.experts)&&s.J}
let S=load();
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const s=JSON.parse(r);if(valid(s))return s}}catch(e){}
  try{const r=localStorage.getItem(OLD);if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.crit))return migrate(o)}}catch(e){}
  return fresh();
}
const FILEMODE=/*FILEMODE*/false;
let fh=null,pendingH=null,dirty=false,lastFile=null,lsFail=false,wT=null,writing=false;
const fsOk=FILEMODE&&typeof window.showSaveFilePicker==='function'&&typeof window.showOpenFilePicker==='function';
function save(){
  S.savedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));lsFail=false}catch(e){lsFail=true}
  if(FILEMODE){dirty=true;if(fh){clearTimeout(wT);wT=setTimeout(writeFile,1200)}paintStore()}
}
async function writeFile(){
  if(!fh||writing){if(writing){clearTimeout(wT);wT=setTimeout(writeFile,300)}return}
  writing=true;
  try{const w=await fh.createWritable();await w.write(payloadFor(fh.name));await w.close();dirty=false;lastFile=Date.now()}
  catch(e){toast('No se pudo escribir en el archivo: usa «Descargar copia»')}
  writing=false;paintStore();
}
function agoTxt(t){if(!t)return '';const m=Math.round((Date.now()-t)/60000);return m<1?'hace menos de 1 min':m<60?'hace '+m+' min':'hace '+Math.round(m/60)+' h'}
function paintStore(){
  const el=document.querySelector('#store');if(!el||!FILEMODE)return;el.hidden=false;
  let st,cls='';
  if(fh){st=dirty?'Guardando en «'+fh.name+'»…':'✓ Guardado automático en «'+fh.name+'»';cls=dirty?'':'ok'}
  else if(lsFail){st='Este navegador no guarda aquí: descarga una copia para no perder datos';cls='bad'}
  else if(dirty||!lastFile){st='Guardado en este navegador · sin copia en archivo todavía';cls='bad'}
  else{st='Guardado en este navegador · copia en archivo '+agoTxt(lastFile);cls='ok'}
  el.innerHTML=`<span class="st ${cls}">${esc(st)}</span>`+
    (pendingH&&!fh?`<button class="btn sm primary" data-act="fs-reconnect" type="button">Reconectar «${esc(pendingH.name)}»</button>`:'')+
    (fsOk?`<button class="btn sm" data-act="fs-new" type="button">Crear archivo de guardado (.xlsx)</button><button class="btn sm" data-act="fs-open" type="button">Abrir archivo guardado</button>`:`<button class="btn sm" data-act="ld" type="button">Cargar Excel o respaldo…</button>`)+
    `<button class="btn sm primary" data-act="dl" type="button">Descargar Excel</button><button class="btn sm" data-act="dlj" type="button">Respaldo .json</button>`;
}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('mcda-fs',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function hGet(){try{const d=await idb();return await new Promise(res=>{const q=d.transaction('h').objectStore('h').get('main');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(e){return null}}
async function hSet(h){try{const d=await idb();await new Promise(res=>{const t=d.transaction('h','readwrite');t.objectStore('h').put(h,'main');t.oncomplete=()=>res();t.onerror=()=>res()})}catch(e){}}
function adopt(s,msg){S=s;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render();toast(msg)}
async function readHandle(h){const f=await h.getFile();
  if(/\.xlsx$/i.test(h.name)){if(!f.size||!xlsxOk())return null;try{return stateFromXlsx(await f.arrayBuffer())}catch(e){return null}}
  const t=(await f.text()).trim();if(!t)return null;try{const s=JSON.parse(t);return valid(s)?s:null}catch(e){return null}}
async function connect(h,silent){
  try{
    const fileS=await readHandle(h);
    if(fileS){
      const fileNewer=(fileS.savedAt||0)>(S.savedAt||0);
      if(fileS.savedAt!==S.savedAt){
        const useFile=silent?fileNewer:confirm('El archivo «'+h.name+'» tiene datos guardados '+new Date(fileS.savedAt||0).toLocaleString()+' y este navegador tiene datos de '+(S.savedAt?new Date(S.savedAt).toLocaleString():'un estado nuevo')+'.\n\nAceptar: usar los del ARCHIVO.\nCancelar: conservar los de este navegador y sobrescribir el archivo.');
        if(useFile)adopt(fileS,'Se cargaron los datos del archivo');
      }
    }
    fh=h;pendingH=null;await hSet(h);
    await writeFile();
  }catch(e){toast('No se pudo abrir el archivo de guardado')}
  paintStore();
}
async function initFS(){
  paintStore();
  if(!fsOk)return;
  const h=await hGet();if(!h)return;
  pendingH=h;paintStore();
  try{if(await h.queryPermission({mode:'readwrite'})==='granted')await connect(h,true)}catch(e){}
}
async function fsNew(){
  try{const h=await window.showSaveFilePicker({suggestedName:'MCDA_datos.xlsx',types:[{description:'Excel MCDA',accept:{[XT]:['.xlsx']}}]});
    fh=h;pendingH=null;await hSet(h);await writeFile();toast('Archivo de guardado creado: '+h.name)}
  catch(e){if(e.name!=='AbortError')toast('No se pudo crear el archivo')}
  paintStore();
}
async function fsOpen(){
  try{const [h]=await window.showOpenFilePicker({types:[{description:'Excel MCDA o respaldo',accept:{[XT]:['.xlsx'],'application/json':['.json']}}]});
    if(await h.requestPermission({mode:'readwrite'})!=='granted'){toast('Sin permiso para guardar en ese archivo');return}
    const s=await readHandle(h);if(!s){toast('Ese archivo no tiene datos MCDA válidos');return}
    adopt(s,'Datos cargados desde «'+h.name+'»');fh=h;pendingH=null;await hSet(h);dirty=false;lastFile=Date.now()}
  catch(e){if(e.name!=='AbortError')toast('No se pudo abrir el archivo')}
  paintStore();
}
async function fsReconnect(){
  try{if(await pendingH.requestPermission({mode:'readwrite'})!=='granted'){toast('Sin permiso para el archivo');return}await connect(pendingH,false)}
  catch(e){toast('No se pudo reconectar')}
}

const C_P='8B6CFF',C_P2='5B3FCC',C_G='D8F5E3',C_GR='666666';
const fillP={patternType:'solid',fgColor:{rgb:C_P}};
const stl={
  title:{font:{bold:true,sz:14,color:{rgb:C_P}}},
  note:{font:{italic:true,sz:9,color:{rgb:C_GR}},alignment:{wrapText:true,vertical:'top'}},
  hdr:{font:{bold:true,color:{rgb:'FFFFFF'}},fill:fillP,alignment:{horizontal:'center',vertical:'center',wrapText:true}},
  hdrL:{font:{bold:true,color:{rgb:'FFFFFF'}},fill:fillP,alignment:{vertical:'center',wrapText:true}},
  b:{font:{bold:true}},b12:{font:{bold:true,sz:12}},sub:{font:{bold:true,color:{rgb:C_P2}}},
  key:{font:{bold:true},fill:{patternType:'solid',fgColor:{rgb:C_G}}},
  c:{alignment:{horizontal:'center'}},wrap:{alignment:{wrapText:true,vertical:'top'}},
  gain:{font:{bold:true,sz:12,color:{rgb:C_P}}},gkey:{font:{bold:true,sz:12},fill:{patternType:'solid',fgColor:{rgb:C_G}}}
};
function colL(i){let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s}
function W(){
  const ws={},m={r:1,c:0};
  const put=(r,c,v,o)=>{o=o||{};const cell={};
    if(v==null||v===''){cell.t='s';cell.v=''}else if(typeof v==='number'){cell.t='n';cell.v=v}else{cell.t='s';cell.v=String(v)}
    if(o.f)cell.f=o.f;if(o.s)cell.s=o.s;if(o.z)cell.z=o.z;ws[colL(c)+r]=cell;if(r>m.r)m.r=r;if(c>m.c)m.c=c};
  const fin=(cols,rows,merges)=>{ws['!ref']='A1:'+colL(m.c)+m.r;ws['!cols']=cols.map(w=>({wch:w}));if(rows)ws['!rows']=rows;if(merges)ws['!merges']=merges;return ws};
  return {ws,put,fin};
}
const qs=n=>"'"+n.replace(/'/g,"''")+"'!";
function ahpSheet(items,maps,exNames,title,note,isCrit){
  const n=items.length,names=items.map(x=>x.name),{put,fin}=W(),E=maps.length;
  const A=aggMatrix(items,maps),an=analyze(A),EM=maps.map(m=>expertMatrix(items,m));
  const rSum=3+n,rNH=5+n,rN0=6+n,rVH=7+2*n,rA0=8+2*n,rLam=8+3*n,rCI=9+3*n,rRI=10+3*n,rCR=11+3*n,rOK=12+3*n,rInd=14+3*n,vc=n+1;
  const t0=b=>rInd+2+b*(n+3),m0=b=>t0(b)+2,last=colL(n);
  put(1,0,title,{s:stl.title});put(1,1,note,{s:stl.note});
  for(let j=0;j<n;j++)put(2,1+j,names[j],{s:stl.hdr});
  for(let i=0;i<n;i++){
    put(3+i,0,names[i],{s:stl.hdrL});
    for(let j=0;j<n;j++){
      const o={s:stl.c,z:'0.000'};
      if(i===j)put(3+i,1+j,1,o);
      else if(i<j){o.f='GEOMEAN('+maps.map((_,b)=>colL(1+j)+(m0(b)+i)).join(',')+')';put(3+i,1+j,A[i][j],o)}
      else{o.f='1/'+colL(1+i)+(3+j);put(3+i,1+j,A[i][j],o)}
    }
  }
  put(rSum,0,'Suma',{s:stl.b});
  for(let j=0;j<n;j++)put(rSum,1+j,A.reduce((a,r)=>a+r[j],0),{f:`SUM(${colL(1+j)}3:${colL(1+j)}${2+n})`,s:stl.b,z:'0.000'});
  put(rNH,0,'Normalizada',{s:stl.b});put(rNH,vc,'Vector prioridad',{s:stl.b});
  for(let i=0;i<n;i++){
    put(rN0+i,0,names[i]);
    for(let j=0;j<n;j++)put(rN0+i,1+j,an.N[i][j],{f:`${colL(1+j)}${3+i}/${colL(1+j)}$${rSum}`,z:'0.0000'});
    put(rN0+i,vc,an.w[i],{f:`AVERAGE(B${rN0+i}:${last}${rN0+i})`,s:stl.key,z:'0.0000'});
  }
  put(rVH,0,'Verificación de consistencia',{s:stl.b12});
  const Aw=A.map(r=>r.reduce((a,x,j)=>a+x*an.w[j],0));
  for(let i=0;i<n;i++){
    const r=rA0+i;put(r,0,'A·w ('+names[i]+')');
    put(r,1,Aw[i],{f:Array.from({length:n},(_,j)=>`${colL(1+j)}${3+i}*$${colL(vc)}$${rN0+j}`).join(' + '),z:'0.0000'});
    put(r,2,Aw[i]/an.w[i],{f:`B${r}/${colL(vc)}${rN0+i}`,z:'0.0000'});put(r,3,'lambda parcial');
  }
  put(rLam,0,'lambda_max');put(rLam,1,an.lam,{f:`AVERAGE(C${rA0}:C${rA0+n-1})`,z:'0.0000'});
  put(rCI,0,'CI = (lambda_max - n) / (n - 1)');put(rCI,1,an.ci,{f:`(B${rLam}-${n})/(${n}-1)`,z:'0.0000'});
  put(rRI,0,`RI (tabla Saaty, n=${n})`);put(rRI,1,an.ri,{z:'0.00'});
  put(rCR,0,'CR = CI / RI',{s:stl.b});put(rCR,1,an.cr,{f:`IFERROR(B${rCI}/B${rRI},0)`,s:stl.key,z:'0.0000'});
  put(rOK,0,'¿Consistente? (CR < 0.10)',{s:stl.b});put(rOK,1,an.ok?'Sí, consistente':'No, revisar juicios',{f:`IF(B${rCR}<0.1,"Sí, consistente","No, revisar juicios")`,s:stl.b});
  put(rInd,0,'Juicios individuales de los '+E+' expertos (entrada de GEOMEAN() de arriba)',{s:stl.b12});
  for(let b=0;b<E;b++){
    put(t0(b),0,`Experto ${b+1}: ${exNames[b]}`,{s:stl.sub});
    for(let j=0;j<n;j++)put(t0(b)+1,1+j,names[j],{s:stl.hdr});
    for(let i=0;i<n;i++){
      put(m0(b)+i,0,names[i],{s:stl.hdrL});
      for(let j=0;j<n;j++){
        const o={s:stl.c,z:'# ?/?'};
        if(i===j)put(m0(b)+i,1+j,1,o);
        else if(i<j)put(m0(b)+i,1+j,EM[b][i][j],o);
        else{o.f='1/'+colL(1+i)+(m0(b)+j);put(m0(b)+i,1+j,EM[b][i][j],o)}
      }
    }
  }
  if(isCrit){
    let p=m0(E-1)+n+2;
    put(p,0,'Verificación con el método EXACTO (Saaty, 1980): iteración de potencias',{s:stl.b});
    put(p+1,0,'w(k+1) = A·w(k), normalizado en cada paso. Arranca de un vector parejo (1/n cada uno) y converge al mismo vector de prioridad que el atajo de la columna «Vector prioridad» (normalizar + promediar).',{s:stl.note});
    let r=p+3,prev=r,pv=Array(n).fill(1/n);
    put(r,0,'w(0), arranque parejo',{s:stl.b});for(let j=0;j<n;j++)put(r,1+j,1/n,{f:`1/${n}`,z:'0.0000'});
    for(let k=1;k<=6;k++){
      const rA=prev+1,rW=prev+2,q=A.map(row=>row.reduce((a,x,j)=>a+x*pv[j],0)),sm=q.reduce((a,b)=>a+b,0);
      put(rA,0,`Iteración ${k}, A·w(${k-1}) (sin normalizar)`);put(rW,0,`w(${k})`,{s:stl.b});
      for(let j=0;j<n;j++){
        put(rA,1+j,q[j],{f:`SUMPRODUCT(B${3+j}:${last}${3+j},B${prev}:${last}${prev})`,z:'0.0000'});
        put(rW,1+j,q[j]/sm,{f:`${colL(1+j)}${rA}/SUM(B${rA}:${last}${rA})`,z:'0.0000'});
      }
      pv=q.map(x=>x/sm);prev=rW;
    }
    put(prev+2,0,'Comparando con el atajo (normalizar + promediar)',{s:stl.b});
    put(prev+3,0,'Potencias, w(6)');put(prev+4,0,'Atajo (normalizar+promediar)');put(prev+5,0,'Diferencia máxima',{s:stl.b});
    for(let j=0;j<n;j++){put(prev+3,1+j,pv[j],{f:`${colL(1+j)}${prev}`,z:'0.0000'});put(prev+4,1+j,an.w[j],{f:`${colL(vc)}${rN0+j}`,z:'0.0000'})}
    put(prev+5,1,Math.max(...pv.map((x,j)=>Math.abs(x-an.w[j]))),{f:'MAX('+Array.from({length:n},(_,j)=>`ABS(${colL(1+j)}${prev+3}-${colL(1+j)}${prev+4})`).join(',')+')',s:stl.b,z:'0.0000'});
  }
  const cols=[34,...Array.from({length:Math.max(n,4)+1},()=>17)];
  return {ws:fin(cols,[{hpt:30}],[{s:{r:0,c:1},e:{r:0,c:Math.max(n,4)}}]),rN0,vc};
}

  /* Síntesis */

   put(g,0,'Ganador',{s:stl.gain});put(g,1,d.tie?'Empate (sin juicios)':top.name,{f:`INDEX(A4:A${3+m},MATCH(MAX(${colL(G)}4:${colL(G)}${3+m}),${colL(G)}4:${colL(G)}${3+m},0))`,s:stl.gkey});
   put(g,2,'con prioridad global de');put(g,3,top.g,{f:`MAX(${colL(G)}4:${colL(G)}${3+m})`,z:'0.0%'});
   add('Síntesis',fin([26,...Array.from({length:nc+2},()=>16)],[{hpt:20},{hpt:34}]));}
  /* datos ocultos para volver a cargar */
  {const {put,fin}=W(),txt=JSON.stringify(S);for(let i=0,r=1;i<txt.length;i+=30000,r++)put(r,0,txt.slice(i,i+30000));add('_datos',fin([20]))}
  wb.Workbook={Sheets:wb.SheetNames.map(n=>({Hidden:n==='_datos'?1:0}))};

function loadCopy(file){

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2400)}
const partOf=v=>v&&v[0]==='A'&&v.length===2?'A':'B';

/* ---------- PARTE A: cálculo ---------- */
const alive=()=>S.A.cands.filter(c=>c.stage==='keep');
function cols(){return S.A.mode==='q'?S.A.questions.map((q,i)=>({key:i,label:'Q'+(i+1)})):S.A.evaluators.map(e=>({key:e.id,label:e.name}))}
function scoreOf(c,k){return S.A.mode==='q'?c.sq[k]:c.se[k]}
function mean(c){
  const v=cols().map(x=>scoreOf(c,x.key)).filter(x=>typeof x==='number'&&x>=1&&x<=5);
  return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;
}
const passes=c=>{const m=mean(c);return m!=null&&m>=S.A.cutoff-1e-9};
const ranked=()=>alive().slice().sort((a,b)=>(mean(b)??-1)-(mean(a)??-1));
const finalists=()=>ranked().filter(passes);
const f2=m=>m==null?'—':m.toFixed(2);

/* ---------- PARTE B: cálculo AHP ---------- */
const pairsOf=n=>{const p=[];for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)p.push([i,j]);return p};
const ratio=v=>v==null||v===0?1:(v<0?-v+1:1/(v+1));
function getV(m,a,b){const k=a+'-'+b;if(m[k]!=null)return m[k];const r=m[b+'-'+a];return r!=null?-r:null}
function setV(m,a,b,v){delete m[b+'-'+a];m[a+'-'+b]=v}
function bItems(v){return v==='crit'?S.crit:S.alt}
function mapFor(v,eid){
  if(v==='crit'){return S.J.crit[eid]||(S.J.crit[eid]={})}
  const cid=v.slice(4);const c=S.J.alt[cid]||(S.J.alt[cid]={});return c[eid]||(c[eid]={});
}
function expertMatrix(items,m){const n=items.length,A=Array.from({length:n},()=>Array(n).fill(1));
  pairsOf(n).forEach(([i,j])=>{const r=ratio(getV(m,items[i].id,items[j].id));A[i][j]=r;A[j][i]=1/r});return A}
function aggMatrix(items,maps){const n=items.length,A=Array.from({length:n},()=>Array(n).fill(1));
  pairsOf(n).forEach(([i,j])=>{const g=Math.exp(maps.reduce((a,m)=>a+Math.log(ratio(getV(m,items[i].id,items[j].id))),0)/maps.length);A[i][j]=g;A[j][i]=1/g});return A}
function analyze(A){
  const n=A.length,cs=Array(n).fill(0);A.forEach(r=>r.forEach((x,j)=>cs[j]+=x));
  const N=A.map(r=>r.map((x,j)=>x/cs[j])),w=N.map(r=>r.reduce((a,b)=>a+b,0)/n);
  const Aw=A.map(r=>r.reduce((a,x,j)=>a+x*w[j],0)),lam=Aw.reduce((a,x,i)=>a+x/w[i],0)/n;
  const ci=(lam-n)/(n-1),ri=RI[n]!==undefined?RI[n]:1.49,cr=ri>0?Math.max(0,ci/ri):0;
  let p=Array(n).fill(1/n);for(let k=0;k<60;k++){const q=A.map(r=>r.reduce((a,x,j)=>a+x*p[j],0)),s=q.reduce((a,b)=>a+b,0);p=q.map(x=>x/s)}
  return {n,N,w,lam,ci:Math.max(0,ci),ri,cr,diff:Math.max(...p.map((x,i)=>Math.abs(x-w[i]))),ok:cr<0.1};
}
const fmt=a=>{if(a>=0.995)return Math.abs(a-Math.round(a))<0.005?String(Math.round(a)):a.toFixed(2);const r=1/a;return Math.abs(r-Math.round(r))<0.005?'1/'+Math.round(r):a.toFixed(3)};
function sheetInfo(v){
  if(v==='crit')return {items:S.crit,title:'Criterios',lead:'Compara los criterios entre sí: ¿cuál importa más para el objetivo de la tesis?',hint:'Objetivo: '+S.obj,unit:'importante'};
  const c=S.crit.find(x=>x.id===v.slice(4));
  return {items:S.alt,title:c?c.name:'(criterio eliminado)',lead:'Compara las estrategias solo respecto a este criterio.',hint:(c&&c.hint)||'Compara qué estrategia es mejor en este criterio.',unit:'preferida'};
}
function sheetResult(v){
  const si=sheetInfo(v),items=si.items,maps=S.experts.map(e=>mapFor(v,e.id));
  const answered=maps.map(m=>pairsOf(items.length).filter(([i,j])=>getV(m,items[i].id,items[j].id)!=null).length);
  return {si,n:items.length,agg:analyze(aggMatrix(items,maps)),per:maps.map(m=>analyze(expertMatrix(items,m))),answered,maps};
}
const altSheets=()=>S.crit.map(c=>'alt:'+c.id);
const totalPairs=()=>S.experts.length*(pairsOf(S.crit.length).length+S.crit.length*pairsOf(S.alt.length).length);
function doneCount(){let d=0;['crit',...altSheets()].forEach(v=>{const it=bItems(v);S.experts.forEach(e=>{const m=mapFor(v,e.id);pairsOf(it.length).forEach(([i,j])=>{if(getV(m,it[i].id,it[j].id)!=null)d++})})});return d}
function synData(){
  const wr=sheetResult('crit').agg.w,loc=S.crit.map(c=>sheetResult('alt:'+c.id).agg.w);
  const rows=S.alt.map((a,i)=>{const contrib=wr.map((w,c)=>w*loc[c][i]);return {name:a.name,loc:loc.map(l=>l[i]),contrib,g:contrib.reduce((x,y)=>x+y,0)}});
  const order=rows.map((_,i)=>i).sort((a,b)=>rows[b].g-rows[a].g);
  rows.forEach(r=>{r.rank=1+rows.filter(o=>o.g>r.g+1e-9).length});
  return {wr,rows,order,tie:Math.max(...rows.map(r=>r.g))-Math.min(...rows.map(r=>r.g))<1e-9};
}

function markdownA(){
  const R=ranked(),ok=R.filter(passes),no=R.filter(c=>!passes(c)),L=[];

  const cs=cols();L.push('',`## 4. Panel de importancia (${S.A.mode==='q'?'5 preguntas de evidencia':'evaluadores'})`,'',`| Criterio | ${cs.map(c=>c.label).join(' | ')} | Ponderación |`,`|---|${cs.map(()=>'---|').join('')}---|`);
  R.forEach(c=>L.push(`| ${c.name} | ${cs.map(x=>scoreOf(c,x.key)??'').join(' | ')} | ${f2(mean(c))} |`));

function syncFinals(){
  const fin=finalists(),added=[],present=[];
  fin.forEach(c=>{
    const k=S.crit.find(x=>x.src===c.id)||S.crit.find(x=>norm(x.name)===norm(c.name));
    if(k){k.src=c.id;present.push(k.name)}else{S.crit.push({id:uid(),src:c.id,name:c.name,hint:''});added.push(c.name)}
  });
  const extra=S.crit.filter(k=>!fin.some(c=>c.id===k.src)).map(k=>k.name);
  save();
  return `Ya estaban en el AHP: ${present.length?present.map(esc).join(', '):'ninguno'}. Agregados: ${added.length?added.map(esc).join(', '):'ninguno'}. `+(extra.length?`En el AHP pero no son finalistas ahora: ${extra.map(esc).join(', ')} (no se borraron; quítalos en Configuración si ya no aplican).`:'No hay criterios de más en el AHP.');
}

function readText(si,i,j,v){

  L.push('## Pesos de los criterios (media geométrica)','','| Criterio | Peso |','|---|---|',...S.crit.map((c,i)=>`| ${c.name} | ${cr.agg.w[i].toFixed(4)} |`),'',`λmax = ${cr.agg.lam.toFixed(4)}; CI = ${cr.agg.ci.toFixed(4)}; RI = ${cr.agg.ri}; **CR = ${cr.agg.cr.toFixed(4)}** (${cr.agg.ok?'consistente':'revisar'}).`,'');
  L.push('## Consistencia por hoja','','| Hoja | CR | ¿Consistente? |','|---|---|---|');
  ['crit',...altSheets()].forEach(k=>{const r=sheetResult(k);L.push(`| ${sheetInfo(k).title} | ${r.agg.cr.toFixed(4)} | ${r.agg.ok?'Sí':'No, revisar'} |`)});
  L.push('','## Síntesis','',`| Estrategia | ${S.crit.map(c=>c.name).join(' | ')} | Global | Ranking |`,`|---|${S.crit.map(()=>'---|').join('')}---|---|`,`| Peso | ${d.wr.map(w=>w.toFixed(4)).join(' | ')} | | |`);
  d.order.forEach(i=>{const r=d.rows[i];L.push(`| ${r.name} | ${r.loc.map(x=>x.toFixed(4)).join(' | ')} | ${r.g.toFixed(4)} | ${r.rank} |`)});
  L.push('',d.tie?'**Empate:** aún no hay juicios que distingan las alternativas.':`**Ganador:** ${d.rows[d.order[0]].name} (prioridad global ${d.rows[d.order[0]].g.toFixed(4)}).`);
  if(S.demo)L.push('','> Advertencia: se usaron juicios de ejemplo, no los del panel.');
  return L.join('\n');
}

/* ---------- render ---------- */
let PEND=null,pendT=null,syncMsg='';
function render(){
  if(S.view==='alt:undefined'||(S.view.startsWith('alt:')&&!S.crit.find(c=>c.id===S.view.slice(4))))S.view='crit';
  paintNav();
  const v=S.view;
  $('#main').innerHTML=({A1:vA1,A2:vA2,A3:vA3,A4:vA4,A5:vA5,bcfg:viewBCfg,syn:viewSyn})[v]?({A1:vA1,A2:vA2,A3:vA3,A4:vA4,A5:vA5,bcfg:viewBCfg,syn:viewSyn})[v]():viewSheet(v);
  if(v==='A4')paintPond();
  if(v==='A5'){paintA5();if(syncMsg)$('#syncmsg').innerHTML=syncMsg}
  if(v==='bcfg'&&syncMsg)$('#syncmsg').innerHTML=syncMsg;
  if(v==='crit'||v.startsWith('alt:'))paintRes();
}
function go(v){S.view=v;syncMsg='';PEND=null;save();render();window.scrollTo({top:0,behavior:'auto'})}
function setPend(id){PEND=id;clearTimeout(pendT);pendT=setTimeout(()=>{PEND=null;render()},4000)}

/* ---------- ejemplo ---------- */
function demoJ(){
  const cs=[5,4,2,3,2.5],as=[[2,5,6,4],[3,5,6,3],[8,6,5,7],[1.5,4,7,4],[2,8,6,2]];
  const toV=r=>r>=1?-(Math.min(9,Math.max(1,Math.round(r)))-1):Math.min(9,Math.max(1,Math.round(1/r)))-1;
  const fac=(e,i,j)=>e%3===0?1:e%3===1?((i+j)%2?1.35:0.8):((i*2+j)%3===0?0.75:1.3);
  const mk=(items,sc,ei)=>{const m={};pairsOf(items.length).forEach(([i,j])=>{m[items[i].id+'-'+items[j].id]=toV(sc(i)/sc(j)*fac(ei,i,j))});return m};
  const J={crit:{},alt:{}};
  S.experts.forEach((e,ei)=>{J.crit[e.id]=mk(S.crit,i=>cs[i%5],ei)});
  S.crit.forEach((c,ci)=>{J.alt[c.id]={};S.experts.forEach((e,ei)=>{J.alt[c.id][e.id]=mk(S.alt,i=>as[ci%5][i%4],ei)})});
  return J;
}
/* ---------- eventos ---------- */
function removeItem(kind,id){
  if(kind==='crit'){S.crit=S.crit.filter(c=>c.id!==id);delete S.J.alt[id];Object.values(S.J.crit).forEach(m=>Object.keys(m).forEach(k=>{if(k.split('-').includes(id))delete m[k]}))}
  if(kind==='alt'){S.alt=S.alt.filter(a=>a.id!==id);Object.values(S.J.alt).forEach(c=>Object.values(c).forEach(m=>Object.keys(m).forEach(k=>{if(k.split('-').includes(id))delete m[k]})))}
  if(kind==='exp'){S.experts=S.experts.filter(e=>e.id!==id);delete S.J.crit[id];Object.values(S.J.alt).forEach(c=>delete c[id])}
  if(kind==='cand'){S.A.cands=S.A.cands.filter(c=>c.id!==id);S.A.cands.forEach(c=>{if(c.target===id){c.target=null;if(c.stage==='merge')c.stage='drop'}})}
  if(kind==='ev'){S.A.evaluators=S.A.evaluators.filter(e=>e.id!==id);S.A.cands.forEach(c=>delete c.se[id])}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const d=b.dataset;
  if(d.part){go(d.part==='A'?(partOf(S.view)==='A'?S.view:'A1'):(partOf(S.view)==='B'?S.view:'bcfg'));return}
  if(d.view){go(d.view);return}
  if(d.ex){S.exId=d.ex;save();render();return}
  if(d.mode){S.A.mode=d.mode;save();render();return}
  if(d.st){const [id,st]=d.st.split(':'),c=cand(id);
    if(st==='keep'){c.stage='keep';c.at=''}else{c.stage=st;c.at='tam';if(st==='merge'){const o=S.A.cands.find(x=>x.id!==c.id&&x.stage==='keep');c.target=o?o.id:null}}
    save();render();return}
  if(d.ind){const [id,st]=d.ind.split(':'),c=cand(id);
    if(st==='ok'){c.stage='keep';c.at=''}else{c.stage='merge';c.at='ind';const o=S.A.cands.find(x=>x.id!==c.id&&x.stage==='keep');c.target=o?o.id:null}
    save();render();return}
  if(d.del){
    if(PEND!==d.del){setPend(d.del);render();return}
    const [kind,id]=d.del.split(':');PEND=null;removeItem(kind,id);save();render();toast('Quitado');return}
  const a=d.act;if(!a)return;
  if(a==='add-cand'){const i=$('#new-cand'),v=i.value.trim();if(!v){i.focus();return}S.A.cands.push({id:uid(),name:v,desc:'',stage:'keep',at:'',target:null,reason:'',evid:'',qmide:'',ind:'',sq:[null,null,null,null,null],se:{},just:'',cutReason:''});save();render();$('#new-cand').focus();return}
  if(a==='add-ev'){const id=uid();S.A.evaluators.push({id,name:'Evaluador '+(S.A.evaluators.length+1)});save();render();return}
  if(a==='add-crit'){S.crit.push({id:uid(),src:null,name:'Nuevo criterio',hint:''});save();render();toast('Criterio agregado al final');return}
  if(a==='add-alt'){S.alt.push({id:uid(),name:'Nueva estrategia'});save();render();toast('Estrategia agregada al final');return}
  if(a==='add-exp'){S.experts.push({id:uid(),name:'Nuevo experto'});save();render();toast('Experto agregado al final');return}
  if(a==='sync'){syncMsg=syncFinals();render();toast('Finalistas llevados al AHP');return}
  if(a==='demo'){S.J=demoJ();S.demo=true;save();render();toast('Juicios de ejemplo cargados');return}
  if(a==='clear'){S.J={crit:{},alt:{}};S.demo=false;save();render();toast('Juicios borrados: todo en 1');return}
  if(a==='reset-ex'){const m=mapFor(S.view,curEx());Object.keys(m).forEach(k=>delete m[k]);save();render();return}
  if(a==='fs-new'){fsNew();return}
  if(a==='fs-open'){fsOpen();return}
  if(a==='fs-reconnect'){fsReconnect();return}
  if(a==='dl'){downloadXlsx();return}
  if(a==='dlj'){downloadJson();return}
  if(a==='ld'){$('#fin').click();return}
  if(a==='mdA'){copy(markdownA(),'Resumen copiado');return}
  if(a==='mdB'){copy(markdownB(),'Resultados copiados');return}
  if(a==='bk-copy'){const t=JSON.stringify(S);$('#bk').value=t;copy(t,'Respaldo copiado');return}
  if(a==='bk-load'){try{const s=JSON.parse($('#bk').value);if(!valid(s))throw 0;S=s;save();render();toast('Respaldo restaurado')}catch(_){toast('El texto no es un respaldo válido')}return}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='new-cand'){const b=document.querySelector('[data-act="add-cand"]');if(b)b.click()}});
document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(t.type==='range'&&d.i!==undefined){
    const v=S.view,si=sheetInfo(v),it=si.items,i=+d.i,j=+d.j,key=it[i].id+'-'+it[j].id,val=+t.value;
    setV(mapFor(v,curEx()),it[i].id,it[j].id,val);save();
    $('#pr-'+key).classList.remove('un');$('#rd-'+key).innerHTML=readText(si,i,j,val);paintRes();paintNav();return}
  if(t.id==='cut'){S.A.cutoff=Math.round(+t.value*10)/10;save();paintA5();paintNav();return}
  if(d.sc){const [id,k]=d.sc.split(':'),c=cand(id),val=t.value===''?null:parseFloat(t.value);
    if(S.A.mode==='q')c.sq[+k]=val;else c.se[k]=val;save();paintPond();paintNav();return}
  if(d.af){cand(d.id)[d.af]=t.value;save();if(S.view==='A5')$('#mdA').value=markdownA();if(d.af==='name')paintNav();return}
  if(d.evn){S.A.evaluators.find(x=>x.id===d.evn).name=t.value;save();return}
  if(d.f==='obj'){S.obj=t.value;save();$('#objline').innerHTML='<b>Objetivo:</b> '+esc(S.obj);return}
  if(d.bf){
    const id=d.id;
    if(d.bf==='cname')S.crit.find(x=>x.id===id).name=t.value;
    else if(d.bf==='chint')S.crit.find(x=>x.id===id).hint=t.value;
    else if(d.bf==='aname')S.alt.find(x=>x.id===id).name=t.value;
    else if(d.bf==='ename')S.experts.find(x=>x.id===id).name=t.value;
    save();paintNav()}
});
document.addEventListener('change',e=>{if(e.target.id==='fin'&&e.target.files[0]){loadCopy(e.target.files[0]);e.target.value='';return}
  if(e.target.dataset.target){const c=cand(e.target.dataset.target);c.target=e.target.value;save()}});
async function copy(txt,msg){
  let ok=false;try{await navigator.clipboard.writeText(txt);ok=true}catch(_){
    const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{ok=document.execCommand('copy')}catch(__){}ta.remove()}
  toast(ok?msg:'No se pudo copiar; usa el texto que aparece en la página');
}
const tip=$('#tip');
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(t){tip.textContent=t.dataset.tip;tip.style.display='block'}});
document.addEventListener('mousemove',e=>{if(tip.style.display==='block'){tip.style.left=Math.min(e.clientX+12,innerWidth-270)+'px';tip.style.top=(e.clientY+14)+'px'}});
document.addEventListener('mouseout',e=>{if(e.target.closest('[data-tip]'))tip.style.display='none'});
render();
initFS();
if(FILEMODE)setInterval(paintStore,30000);
})();
</script>
